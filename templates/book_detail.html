<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ book.title }}</title>
</head>
<body>
    <h1>{{ book.title }}</h1>
    <p><strong>Автор:</strong> {{ book.author }}</p>
    <p><strong>Описание:</strong> {{ book.description }}</p>
    <p><strong>Цена:</strong> {{ book.price }} сом</p>
    <p><em>Добавлено: {{ book.created_at }}</em></p>
    
    <a href="/books/all/">Назад к списку</a>
</body>
</html>

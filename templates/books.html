<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список книг</title>
</head>
<body>
    <h1>Наши книги:</h1>
    <ul>
        {% for book in books %}
            <li>
                <a href="/books/detail/{{ book.id }}/">
                    <strong>{{ book.title }}</strong>
                </a> 
                — {{ book.author }} ({{ book.price }} сом)
            </li>
        {% endfor %}
    </ul>
</body>
</html>
